[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileqa"
version = "0.1.0"
description = "Переносимый набор автотестов файлового API (чёрный ящик): клиент, сценарии, k6 и CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "harness: самопроверка инструментов на синтетических данных, без сети",
  "e2e: внешний HTTP-сценарий на заданном стенде",
  "capacity: квоты количества объектов и суммы байтов",
  "security: проверка согласованной политики и обычных ответов",
  "load: сценарии Grafana k6",
]
addopts = "-ra --strict-markers"
